global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@example.com'
  smtp_auth_username: 'alertmanager@example.com'
  smtp_auth_password: '${SMTP_PASSWORD}'
  slack_api_url: '${SLACK_WEBHOOK_URL}'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # Business alerts - notify business team
    - match:
        team: business
      receiver: 'business-receiver'
      group_wait: 1m
      repeat_interval: 2h

    # Operations alerts - notify ops team
    - match:
        team: operations
      receiver: 'operations-receiver'
      group_wait: 1m
      repeat_interval: 2h

    # Platform alerts - notify platform team
    - match:
        team: platform
      receiver: 'platform-receiver'
      group_wait: 30s
      repeat_interval: 4h

receivers:
  - name: 'default-receiver'
    slack_configs:
      - channel: '#ecommerce-alerts'
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'
        actions:
          - type: button
            text: 'Runbook'
            url: '{{ (index .Alerts 0).Annotations.runbook_url }}'
          - type: button
            text: 'Dashboard'
            url: 'https://grafana.example.com/d/ecommerce-overview'

  - name: 'critical-receiver'
    slack_configs:
      - channel: '#ecommerce-critical'
        send_resolved: true
        title: ':rotating_light: CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ template "slack.default.text" . }}'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        severity: critical
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
    email_configs:
      - to: 'oncall@example.com'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'

  - name: 'business-receiver'
    slack_configs:
      - channel: '#ecommerce-business'
        send_resolved: true
        title: ':chart_with_upwards_trend: Business Alert: {{ .GroupLabels.alertname }}'
        text: '{{ template "slack.default.text" . }}'
    email_configs:
      - to: 'business-alerts@example.com'
        send_resolved: true

  - name: 'operations-receiver'
    slack_configs:
      - channel: '#ecommerce-ops'
        send_resolved: true
        title: ':package: Operations Alert: {{ .GroupLabels.alertname }}'
        text: '{{ template "slack.default.text" . }}'

  - name: 'platform-receiver'
    slack_configs:
      - channel: '#ecommerce-platform'
        send_resolved: true
        title: ':gear: Platform Alert: {{ .GroupLabels.alertname }}'
        text: '{{ template "slack.default.text" . }}'

inhibit_rules:
  # Inhibit warning alerts if critical is firing for same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # Inhibit all alerts if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.+'
    equal: ['service']
