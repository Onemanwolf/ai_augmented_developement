name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'ecommerce-platform/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ecommerce-platform/**'
      - '.github/workflows/ci.yml'

env:
  GO_VERSION: '1.21'
  GOLANGCI_LINT_VERSION: 'v1.55.2'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            ecommerce-platform/shared/go.sum
            ecommerce-platform/services/*/go.sum

      - name: Run golangci-lint on shared
        uses: golangci/golangci-lint-action@v3
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ecommerce-platform/shared

      - name: Run golangci-lint on order service
        uses: golangci/golangci-lint-action@v3
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ecommerce-platform/services/order

      - name: Run golangci-lint on payment service
        uses: golangci/golangci-lint-action@v3
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ecommerce-platform/services/payment

      - name: Run golangci-lint on fulfillment service
        uses: golangci/golangci-lint-action@v3
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ecommerce-platform/services/fulfillment

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            ecommerce-platform/shared/go.sum
            ecommerce-platform/services/*/go.sum

      - name: Test shared packages
        working-directory: ecommerce-platform/shared
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          MONGO_URI: mongodb://localhost:27017

      - name: Test order service
        working-directory: ecommerce-platform/services/order
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          MONGO_URI: mongodb://localhost:27017

      - name: Test payment service
        working-directory: ecommerce-platform/services/payment
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          MONGO_URI: mongodb://localhost:27017

      - name: Test fulfillment service
        working-directory: ecommerce-platform/services/fulfillment
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          MONGO_URI: mongodb://localhost:27017

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        service: [order, payment, fulfillment]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            ecommerce-platform/shared/go.sum
            ecommerce-platform/services/${{ matrix.service }}/go.sum

      - name: Build ${{ matrix.service }} service
        working-directory: ecommerce-platform/services/${{ matrix.service }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o bin/${{ matrix.service }}-service ./cmd/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-service
          path: ecommerce-platform/services/${{ matrix.service }}/bin/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [order, payment, fulfillment]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ecommerce-platform
          file: ecommerce-platform/services/${{ matrix.service }}/Dockerfile
          push: false
          tags: |
            ${{ matrix.service }}-service:${{ github.sha }}
            ${{ matrix.service }}-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'ecommerce-platform'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: ecommerce-platform/shared
