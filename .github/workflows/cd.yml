name: CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'ecommerce-platform/**'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ecommerce

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [order, payment, fulfillment]
    outputs:
      order-tag: ${{ steps.meta-order.outputs.tags }}
      payment-tag: ${{ steps.meta-payment.outputs.tags }}
      fulfillment-tag: ${{ steps.meta-fulfillment.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta-${{ matrix.service }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}-service
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ecommerce-platform
          file: ecommerce-platform/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta-${{ matrix.service }}.outputs.tags }}
          labels: ${{ steps.meta-${{ matrix.service }}.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in Helm values
        run: |
          IMAGE_TAG="${{ github.sha }}"

          # Update order service
          sed -i "s/tag: .*/tag: ${IMAGE_TAG}/" ecommerce-platform/deploy/helm/order/values.yaml || true

          # Update payment service
          sed -i "s/tag: .*/tag: ${IMAGE_TAG}/" ecommerce-platform/deploy/helm/payment/values.yaml || true

          # Update fulfillment service
          sed -i "s/tag: .*/tag: ${IMAGE_TAG}/" ecommerce-platform/deploy/helm/fulfillment/values.yaml || true

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update image tags to ${{ github.sha }}"
          git push
