name: Quality Gates

on:
  push:
    branches: [main, develop]
    paths:
      - 'ecommerce-platform/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ecommerce-platform/**'
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'

env:
  GO_VERSION: '1.21'
  MIN_COVERAGE: 80

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            ecommerce-platform/shared/go.sum
            ecommerce-platform/services/*/go.sum

      - name: Install tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.55.2
          working-directory: ecommerce-platform/shared
          args: --out-format=json > lint-shared.json || true

      - name: Lint Order Service
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.55.2
          working-directory: ecommerce-platform/services/order

      - name: Lint Payment Service
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.55.2
          working-directory: ecommerce-platform/services/payment

      - name: Lint Fulfillment Service
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.55.2
          working-directory: ecommerce-platform/services/fulfillment

      - name: Check cyclomatic complexity
        run: |
          echo "Checking cyclomatic complexity..."
          cd ecommerce-platform
          gocyclo -over 15 . || echo "Some functions exceed complexity threshold"

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            ecommerce-platform/shared/go.sum
            ecommerce-platform/services/*/go.sum

      - name: Test shared package
        working-directory: ecommerce-platform/shared
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Test Order Service
        working-directory: ecommerce-platform/services/order
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out
        env:
          MONGO_URI: mongodb://localhost:27017

      - name: Test Payment Service
        working-directory: ecommerce-platform/services/payment
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out
        env:
          MONGO_URI: mongodb://localhost:27017

      - name: Test Fulfillment Service
        working-directory: ecommerce-platform/services/fulfillment
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out
        env:
          MONGO_URI: mongodb://localhost:27017

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ecommerce-platform
          flags: unittests
          fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          cd ecommerce-platform/shared && govulncheck ./... || true
          cd ../services/order && govulncheck ./... || true
          cd ../payment && govulncheck ./... || true
          cd ../fulfillment && govulncheck ./... || true

      - name: Run gosec
        run: |
          cd ecommerce-platform
          gosec -fmt sarif -out gosec-results.sarif ./... || true

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: ecommerce-platform/gosec-results.sarif

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'ecommerce-platform'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Check licenses
        run: |
          cd ecommerce-platform/shared
          go-licenses check ./... --disallowed_types=forbidden,restricted || true

  quality-gate-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [code-quality, test-coverage, security-scan]
    if: always()
    steps:
      - name: Check quality gates
        run: |
          echo "Quality Gate Results"
          echo "===================="
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Test Coverage: ${{ needs.test-coverage.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"

          if [[ "${{ needs.code-quality.result }}" == "failure" ]] || \
             [[ "${{ needs.test-coverage.result }}" == "failure" ]] || \
             [[ "${{ needs.security-scan.result }}" == "failure" ]]; then
            echo ""
            echo "❌ Quality gates FAILED"
            exit 1
          else
            echo ""
            echo "✅ All quality gates PASSED"
          fi
